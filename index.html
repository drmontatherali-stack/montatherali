<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مكتب تسليم الدور</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#17222d;--mu:#66717d;--bd:#d8dee5;--pr:#0f5c8a;--ok:#1a8a4a;--wn:#d99a00;--er:#c62f2f}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
header{background:var(--pr);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;gap:8px}
header b{font-size:17px}
.wrap{max-width:900px;margin:0 auto;padding:12px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:6px;font:inherit;background:#fff;margin-top:4px}
label{display:block;margin:10px 0;font-size:14px;color:var(--mu)}
label.ck{display:inline-flex;align-items:center;gap:5px;margin:2px 8px 2px 0;color:var(--tx)}
label.ck input{width:auto;margin:0}
.b{border:1px solid var(--bd);background:#fff;color:var(--tx);padding:8px 12px;border-radius:6px;font:inherit;cursor:pointer}
.b.pr{background:var(--pr);color:#fff;border-color:var(--pr)}
.b.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.b.er{background:var(--er);color:#fff;border-color:var(--er)}
.b.wa{background:#25a244;color:#fff;border-color:#25a244}
.b.w{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4)}
.b:disabled{opacity:.5}
#chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.chip{white-space:nowrap;border:1px solid var(--bd);background:#fff;border-radius:16px;padding:6px 12px;font:inherit;cursor:pointer}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.code{font-size:20px;font-weight:700}
.badge{padding:3px 9px;border-radius:12px;font-size:13px;color:#fff;background:var(--mu)}
.s-counting{background:var(--pr)}.s-ready,.s-received{background:var(--ok)}.s-notready{background:var(--er)}.s-postponed{background:var(--wn)}
.info{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0;font-size:13.5px;color:var(--mu)}
.info b{color:var(--tx)}
.cnt{margin:8px 0;padding:8px;border-radius:6px;font-weight:600;border:1px solid}
.cnt.ok{background:#e9f6ee;border-color:var(--ok);color:var(--ok)}
.cnt.wn{background:#fff6dc;border-color:var(--wn);color:#8a6200}
.cnt.er{background:#fde9e9;border-color:var(--er);color:var(--er)}
.bar{height:6px;background:rgba(0,0,0,.1);border-radius:3px;margin-bottom:6px;overflow:hidden}
.bar i{display:block;height:100%;background:currentColor}
.msgs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0;padding-top:8px;border-top:1px dashed var(--bd)}
.msgs small{color:var(--mu);margin-right:2px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mu{color:var(--mu);text-align:center;padding:20px}
#modal,#zoom{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;align-items:center;justify-content:center;padding:10px}
.box{background:#fff;border-radius:10px;padding:16px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
.box h3{margin:0 0 4px}
.row{display:flex;gap:8px;margin-top:14px}.row .b{flex:1}
.seg{display:flex;gap:14px;margin:10px 0}
.log{border-top:1px solid var(--bd);padding:8px 0;font-size:14px}
.th{max-width:100%;max-height:160px;border-radius:6px;margin-top:6px;cursor:zoom-in}
#zoom img{max-width:100%;max-height:100%}
#login{max-width:340px;margin:60px auto;padding:16px}
</style>
</head>
<body>
<div id="login" style="display:none" class="card">
  <h2>مكتب تسليم الدور</h2>
  <label>البريد الإلكتروني<input id="em" type="email" autocomplete="username"></label>
  <label>كلمة المرور<input id="pw" type="password" autocomplete="current-password"></label>
  <button class="b pr" style="width:100%" onclick="doLogin()">دخول</button>
</div>

<div id="app" style="display:none">
  <header>
    <b>مكتب تسليم الدور</b>
    <span><button class="b w" onclick="addUnit()">+ دار جديدة</button> <button class="b w" onclick="auth.signOut()">خروج</button></span>
  </header>
  <div class="wrap">
    <input id="q" placeholder="بحث: بلوك / دار / هاتف / اسم مقاول" oninput="q=this.value;render()">
    <div id="chips"></div>
    <div id="list"></div>
  </div>
</div>
<div id="modal"></div>
<div id="zoom"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== 1) ضع إعدادات مشروع Firebase الجديد هنا ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBVFREknn-F4IQ5VJj5ZKuHtomvZVteox4",
  authDomain: "alameeratproject.firebaseapp.com",
  projectId: "alameeratproject",
  storageBucket: "alameeratproject.firebasestorage.app",
  messagingSenderId: "334982200776",
  appId: "1:334982200776:web:22985ae897260cd3aed4fd",
  measurementId: "G-TW6HW4ELTN"
};

/* ===== 2) نص رسالة واتساب (عدّله كما تريد) ===== */
const MSG = (u) => `السلام عليكم\nالسيد المستفيد المحترم، تم إنجاز ملاحظات الدار (بلوك ${u.block} - دار ${u.house}).\nيرجى مراجعة مكتب التسليم لاستلام دارك.`;

/* ===== 3) مدة الإنجاز وحد التحذير ===== */
const DAYS = 10, WARN_LEFT = 2;

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();
db.enablePersistence({synchronizeTabs: true}).catch(() => {});

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const diff = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const addD = (s, n) => new Date(Date.parse(s) + n * 864e5).toISOString().slice(0, 10);
const ms = u => u.createdAt?.toMillis?.() || Date.now();
const find = id => units.find(u => u.id === id);
const upd = (id, o) => db.collection('units').doc(id).update(o).catch(e => alert('تعذر الحفظ: ' + e.message));
const log = (u, type, o) => db.collection('log').add({unitId: u.id, code: u.block + '/' + u.house, type, date: today(), at: firebase.firestore.FieldValue.serverTimestamp(), ...o}).catch(e => alert('تعذر تسجيل الحركة: ' + e.message));

const S = {waiting:'بانتظار الموعد', counting:'تحت الإنجاز', ready:'جاهز للتبليغ', notready:'غير جاهز', postponed:'مؤجل', received:'تم الاستلام'};
const F = [['active','النشطة'],['alert','⚠ تنبيه'],['today','مواعيد اليوم'],['waiting','بانتظار'],['counting','تحت الإنجاز'],['ready','جاهز'],['notready','غير جاهز'],['postponed','مؤجل'],['received','مستلمة']];
let units = [], filter = 'active', q = '', unsub = null;

/* ---------- الدخول ---------- */
function doLogin() {
  auth.signInWithEmailAndPassword($('#em').value.trim(), $('#pw').value)
    .catch(() => alert('البريد أو كلمة المرور غير صحيحة'));
}
auth.onAuthStateChanged(user => {
  $('#login').style.display = user ? 'none' : 'block';
  $('#app').style.display = user ? 'block' : 'none';
  if (user && !unsub) {
    unsub = db.collection('units').onSnapshot(
      s => { units = s.docs.map(d => ({id: d.id, ...d.data()})); render(); },
      e => alert('خطأ في قراءة البيانات: ' + e.message));
  }
  if (!user && unsub) { unsub(); unsub = null; units = []; }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

/* ---------- الحسابات ---------- */
const dayNo = u => Math.max(1, diff(u.inspectionDate, today()) + 1);
const isAlert = u => u.status === 'counting' && (DAYS - dayNo(u)) <= WARN_LEFT;
function match(u, f) {
  const s = u.status;
  if (f === 'active') return s !== 'received';
  if (f === 'alert') return isAlert(u);
  if (f === 'today') return (s === 'waiting' || s === 'postponed') && u.appointment === today();
  return s === f;
}

/* ---------- العرض ---------- */
function counter(u) {
  if (u.status !== 'counting') return '';
  const d = dayNo(u), left = DAYS - d;
  let c = 'ok', t = `يوم ${d} من ${DAYS}`;
  if (d > DAYS) { c = 'er'; t = `متأخر ${d - DAYS} يوم — سجّل نتيجة الفحص`; }
  else if (left <= WARN_LEFT) { c = 'wn'; t = `⚠ يوم ${d} من ${DAYS} — ` + (left === 0 ? 'اليوم موعد الفحص النهائي' : `باقي ${left} يوم`); }
  return `<div class="cnt ${c}"><div class="bar"><i style="width:${Math.min(d, DAYS) * 100 / DAYS}%"></i></div>${t}</div>`;
}
function card(u) {
  const type = u.type === 'direct' ? 'تنفيذ مباشر' : 'مقاول: ' + esc(u.contractor || '-');
  const dates = [['الحضور', u.arrival], ['الموعد', u.appointment], ['الكشف', u.inspectionDate], ['الاستلام', u.receiptDate]]
    .filter(x => x[1]).map(x => `<span>${x[0]}: <b>${x[1]}</b></span>`).join('');
  const m = u.msgs || [0, 0, 0], md = u.msgDates || [];
  const msgs = `<div class="msgs"><button class="b wa" onclick="wa('${u.id}')">واتساب</button>` +
    [0, 1, 2].map(i => `<label class="ck"><input type="checkbox" ${m[i] ? 'checked' : ''} onchange="tick('${u.id}',${i},this.checked)">رسالة ${i + 1}${md[i] ? `<small>${md[i]}</small>` : ''}</label>`).join('') + `</div>`;
  const s = u.status;
  let acts = '';
  if (s === 'waiting') acts += `<button class="b pr" onclick="inspect('${u.id}')">تسجيل الكشف</button>`;
  if (s === 'counting') acts += `<button class="b pr" onclick="check('${u.id}')">فحص اليوم ${DAYS}</button>`;
  if (s === 'notready') acts += `<button class="b pr" onclick="check('${u.id}')">إعادة فحص</button>`;
  if (s === 'ready' || s === 'postponed') acts += `<button class="b ok" onclick="receive('${u.id}')">تم الاستلام</button><button class="b er" onclick="notReceived('${u.id}')">لم يستلم</button>`;
  acts += `<button class="b" onclick="history('${u.id}')">السجل</button><button class="b" onclick="editUnit('${u.id}')">تعديل</button>`;
  return `<div class="card">
    <div class="top"><span class="code">${esc(u.block)} / ${esc(u.house)}</span><span class="badge s-${s}">${S[s]}</span></div>
    <div class="info"><span>${type}</span><span>هاتف: <b dir="ltr">${esc(u.phone)}</b></span></div>
    <div class="info">${dates}</div>
    ${u.notReceivedReason && s === 'postponed' ? `<div class="info"><span>سبب عدم الاستلام: <b>${esc(u.notReceivedReason)}</b></span></div>` : ''}
    ${counter(u)}
    ${s !== 'received' ? msgs : ''}
    <div class="acts">${acts}</div></div>`;
}
function render() {
  $('#chips').innerHTML = F.map(([k, l]) => `<button class="chip ${filter === k ? 'on' : ''}" onclick="filter='${k}';render()">${l} <small>${units.filter(u => match(u, k)).length}</small></button>`).join('');
  const t = q.trim().toLowerCase();
  const arr = units
    .filter(u => t ? [u.block, u.house, u.phone, u.contractor, u.block + '/' + u.house].join(' ').toLowerCase().includes(t) : match(u, filter))
    .sort((a, b) => (isAlert(b) - isAlert(a)) || (ms(b) - ms(a)));
  $('#list').innerHTML = arr.map(card).join('') || '<p class="mu">لا توجد دور هنا. اضغط "+ دار جديدة" لتسجيل مستفيد.</p>';
}

/* ---------- نافذة عامة ---------- */
const f = (id, l, t = 'text', v = '', x = '') => `<label><span id="f_${id}L">${l}</span><input id="f_${id}" type="${t}" value="${esc(v)}" ${x}></label>`;
const v = id => $('#f_' + id).value.trim();
function modal(title, body, save, label = 'حفظ') {
  const m = $('#modal');
  m.innerHTML = `<div class="box"><h3>${title}</h3><div>${body}</div><div class="row"><button class="b pr" id="ms">${label}</button><button class="b" id="mc">إلغاء</button></div></div>`;
  m.style.display = 'flex';
  const close = () => m.style.display = 'none';
  $('#mc').onclick = close;
  m.onclick = e => { if (e.target === m) close(); };
  $('#ms').onclick = async () => {
    $('#ms').disabled = true;
    try { if (await save() !== false) close(); } catch (e) { alert('خطأ: ' + e.message); }
    $('#ms').disabled = false;
  };
}
const zoom = s => { const z = $('#zoom'); z.innerHTML = `<img src="${s}">`; z.style.display = 'flex'; z.onclick = () => z.style.display = 'none'; };
const shrink = file => new Promise((res, rej) => {
  const i = new Image();
  i.onload = () => {
    const k = Math.min(1, 900 / Math.max(i.width, i.height)), c = document.createElement('canvas');
    c.width = i.width * k; c.height = i.height * k;
    c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
    res(c.toDataURL('image/jpeg', .6));
  };
  i.onerror = () => rej(new Error('تعذر قراءة الصورة'));
  i.src = URL.createObjectURL(file);
});

/* ---------- دار جديدة / تعديل ---------- */
function typeCh(auto) {
  const d = v('t') === 'direct';
  $('#cw').style.display = d ? 'none' : 'block';
  $('#f_apL').textContent = d ? 'موعد التنظيف (بعد يومين)' : 'موعد الحضور (بعد 10 أيام)';
  if (auto && v('a')) $('#f_ap').value = addD(v('a'), d ? 2 : 10);
}
const typeSel = val => `<label>النوع<select id="f_t" onchange="typeCh(true)"><option value="direct" ${val === 'direct' ? 'selected' : ''}>تنفيذ مباشر</option><option value="contractor" ${val === 'contractor' ? 'selected' : ''}>دور مقاولين</option></select></label>`;
const contractorBox = (val, show) => `<div id="cw" style="display:${show ? 'block' : 'none'}">${f('c', 'اسم المقاول', 'text', val || '', 'list="cl"')}<datalist id="cl">${[...new Set(units.map(u => u.contractor).filter(Boolean))].map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>`;

function addUnit() {
  modal('دار جديدة',
    f('b', 'رقم البلوك') + f('h', 'رقم الدار') + f('p', 'هاتف المستفيد', 'tel') + typeSel('direct') + contractorBox('', false) +
    f('a', 'تاريخ الحضور', 'date', today(), 'onchange="typeCh(true)"') + f('ap', 'موعد التنظيف (بعد يومين)', 'date', addD(today(), 2)),
    () => {
      const o = {block: v('b'), house: v('h'), phone: v('p'), type: v('t'), contractor: v('t') === 'contractor' ? v('c') : '', arrival: v('a'), appointment: v('ap')};
      if (!o.block || !o.house || !o.phone || !o.arrival || !o.appointment) { alert('أكمل: البلوك، الدار، الهاتف، تاريخ الحضور، والموعد'); return false; }
      if (o.type === 'contractor' && !o.contractor) { alert('اكتب اسم المقاول'); return false; }
      if (units.some(u => u.block === o.block && u.house === o.house && u.status !== 'received') && !confirm('هذه الدار مسجلة سابقاً وغير مستلمة. تسجيلها مرة ثانية؟')) return false;
      db.collection('units').add({...o, status: 'waiting', msgs: [false, false, false], msgDates: ['', '', ''], createdAt: firebase.firestore.FieldValue.serverTimestamp()}).catch(e => alert('تعذر الحفظ: ' + e.message));
    });
}
function editUnit(id) {
  const u = find(id);
  modal('تعديل ' + esc(u.block) + '/' + esc(u.house),
    f('b', 'رقم البلوك', 'text', u.block) + f('h', 'رقم الدار', 'text', u.house) + f('p', 'هاتف المستفيد', 'tel', u.phone) + typeSel(u.type) + contractorBox(u.contractor, u.type === 'contractor') +
    f('ap', 'الموعد', 'date', u.appointment || '') +
    `<button class="b er" onclick="delUnit('${id}')">حذف الدار</button>`,
    () => {
      const o = {block: v('b'), house: v('h'), phone: v('p'), type: v('t'), contractor: v('t') === 'contractor' ? v('c') : '', appointment: v('ap')};
      if (!o.block || !o.house || !o.phone) { alert('البلوك والدار والهاتف مطلوبة'); return false; }
      upd(id, o);
    });
}
function delUnit(id) {
  if (!confirm('حذف هذه الدار نهائياً؟')) return;
  db.collection('units').doc(id).delete().then(() => $('#modal').style.display = 'none').catch(e => alert(e.message));
}

/* ---------- خطوات الإجراء ---------- */
function inspect(id) {
  const u = find(id);
  modal('تسجيل الكشف — ' + esc(u.block) + '/' + esc(u.house),
    f('d', 'تاريخ الكشف (يبدأ منه العداد)', 'date', today()) + f('tc', 'اسم الفني') +
    `<label>الملاحظات<textarea id="f_tx" rows="3"></textarea></label>`,
    () => {
      if (!v('d')) { alert('اكتب تاريخ الكشف'); return false; }
      upd(id, {status: 'counting', inspectionDate: v('d'), inspectionTech: v('tc')});
      log(u, 'inspection', {tech: v('tc'), text: $('#f_tx').value.trim(), date: v('d')});
    });
}
function check(id) {
  const u = find(id);
  modal('فحص اليوم ' + DAYS + ' — ' + esc(u.block) + '/' + esc(u.house),
    `<div class="seg"><label class="ck"><input type="radio" name="r" value="ready" checked> جاهز</label><label class="ck"><input type="radio" name="r" value="notready"> غير جاهز</label></div>` +
    f('d', 'تاريخ الفحص', 'date', today()) + f('tc', 'اسم الفني') +
    `<label class="ck"><input type="checkbox" id="f_pr"> المستفيد حاضر</label>` +
    `<label>سبب عدم الجاهزية / ملاحظات<textarea id="f_tx" rows="3"></textarea></label>` +
    `<label>صورة الملاحظات<input id="f_ph" type="file" accept="image/*"></label>`,
    async () => {
      const r = document.querySelector('input[name=r]:checked').value, text = $('#f_tx').value.trim(), file = $('#f_ph').files[0];
      if (!v('d')) { alert('اكتب تاريخ الفحص'); return false; }
      if (r === 'notready' && !text && !file) { alert('اكتب سبب عدم الجاهزية أو أرفق صورة'); return false; }
      const photo = file ? await shrink(file) : '';
      upd(id, {status: r, lastCheck: v('d')});
      log(u, 'check', {result: r, tech: v('tc'), present: $('#f_pr').checked, text, photo, date: v('d')});
    });
}
function receive(id) {
  const u = find(id);
  modal('تم الاستلام — ' + esc(u.block) + '/' + esc(u.house), f('d', 'تاريخ الاستلام', 'date', today()), () => {
    if (!v('d')) { alert('اكتب تاريخ الاستلام'); return false; }
    upd(id, {status: 'received', receiptDate: v('d')});
    log(u, 'received', {date: v('d')});
  });
}
function notReceived(id) {
  const u = find(id);
  modal('لم يستلم — ' + esc(u.block) + '/' + esc(u.house),
    `<label>السبب<select id="f_rs"><option>لم يحضر</option><option>ظرف طارئ</option><option>رفض الدار</option><option>ملاحظات مستجدة</option><option>أخرى</option></select></label>` +
    `<label>تفاصيل (اختياري)<textarea id="f_tx" rows="2"></textarea></label>` + f('d', 'الموعد الجديد', 'date', addD(today(), 1)),
    () => {
      if (!v('d')) { alert('حدد الموعد الجديد'); return false; }
      const reason = $('#f_rs').value + ($('#f_tx').value.trim() ? ' — ' + $('#f_tx').value.trim() : '');
      upd(id, {status: 'postponed', appointment: v('d'), notReceivedReason: reason});
      log(u, 'postponed', {text: reason, next: v('d')});
    });
}
async function history(id) {
  const u = find(id);
  modal('سجل ' + esc(u.block) + '/' + esc(u.house), '<div id="hl">جاري التحميل…</div>', () => {}, 'إغلاق');
  const T = {inspection: 'تسجيل الكشف', check: 'فحص', received: 'تم الاستلام', postponed: 'لم يستلم'};
  try {
    const s = await db.collection('log').where('unitId', '==', id).get();
    const rows = s.docs.map(d => d.data()).sort((a, b) => (b.at?.toMillis?.() || Date.now()) - (a.at?.toMillis?.() || Date.now()));
    $('#hl').innerHTML = rows.map(l => `<div class="log"><b>${T[l.type] || l.type}</b> — ${l.date}
      ${l.result ? ` — <b>${l.result === 'ready' ? 'جاهز' : 'غير جاهز'}</b>` : ''}
      ${l.tech ? `<br>الفني: ${esc(l.tech)}${l.present ? ' (بحضور المستفيد)' : ''}` : ''}
      ${l.text ? `<br>${esc(l.text)}` : ''}${l.next ? `<br>الموعد الجديد: ${l.next}` : ''}
      ${l.photo ? `<br><img class="th" src="${l.photo}" onclick="zoom(this.src)">` : ''}</div>`).join('') || '<p class="mu">لا توجد حركات بعد</p>';
  } catch (e) { $('#hl').textContent = 'تعذر التحميل: ' + e.message; }
}

/* ---------- واتساب ---------- */
function tick(id, i, val) {
  const u = find(id), m = [...(u.msgs || [0, 0, 0])].map(Boolean), d = [...(u.msgDates || ['', '', ''])];
  m[i] = val; d[i] = val ? today() : '';
  upd(id, {msgs: m, msgDates: d});
}
function wa(id) {
  const u = find(id);
  let p = String(u.phone || '').replace(/\D/g, '');
  if (p.startsWith('00')) p = p.slice(2);
  if (p.startsWith('0')) p = '964' + p.slice(1);
  else if (p.length === 10 && p.startsWith('7')) p = '964' + p;
  const m = [...(u.msgs || [0, 0, 0])].map(Boolean), d = [...(u.msgDates || ['', '', ''])], i = m.indexOf(false);
  if (i > -1) { m[i] = true; d[i] = today(); upd(id, {msgs: m, msgDates: d}); }
  location.href = 'whatsapp://send?phone=' + p + '&text=' + encodeURIComponent(MSG(u));
}
